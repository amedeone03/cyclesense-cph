study_area:
  name: central_copenhagen_indre_by_pilot
  place_label: "Indre By core, Copenhagen, Denmark"
  boundary_type: bbox
  crs: EPSG:4326
  # Exact study rectangle in WGS84. This is the boundary, not a geocoder result.
  west: 12.5630
  south: 55.6705
  east: 12.5965
  north: 55.6880
  graph_type: bike
  simplify: true
  retain_all: true
  truncate_by_edge: false
  preserve_oneway: true
  graph_snapshot_date: null

simulation:
  random_seed: 42
  evaluation_seed_offset: 10007
  calibration_routes: 500
  held_out_routes: 250
  min_od_distance_m: 400
  max_od_distance_m: 2500
  min_eligible_edges: 3
  max_attempts_factor: 80
  scenarios:
    - uniform
    - commuter_proxy
  commuter_proxy:
    anchor_name: Rådhuspladsen
    anchor_lat: 55.6761
    anchor_lon: 12.5689
    distance_floor_m: 50
  deferred_scenarios:
    - alternative_route

candidates:
  rule: eligible_physical_edge
  min_length_m: 15
  bidirectional_counting: true

placement:
  counter_budgets: [5, 10, 20, 30]
  stochastic_seeds: [42, 43, 44, 45, 46]
  map_budget: 10
  map_seed: 42
  candidate_rule: eligible_physical_edge
  methods:
    - random
    - geographical_kmeans
    - route_frequency
    - greedy
  deferred:
    - community_aware_greedy

similarity:
  signature_size: 128
  approximate_jaccard_threshold: 0.5
  graph_thresholds: [0.3, 0.4, 0.5, 0.6, 0.7]
  retrieval_thresholds: [0.3, 0.5, 0.7]
  louvain_seeds: [42, 43, 44, 45, 46]
  louvain_resolution: 1
  assignment_rule: neighbor_consensus
  scalability_sizes: [100, 250, 500, 1000, 2000]
  scalability_seed: 24242
  scalability_scenario: uniform

optimization:
  lambdas: [0, 0.1, 0.25, 0.5, 0.75]
  community_thresholds: [0.5, 0.3]
  primary_threshold: 0.5
  louvain_seed: 42
  shuffle_seeds: [42, 43, 44]
  large_community_min_size: 2
  map_budget: 10
  map_lambda: 0.25

validation:
  shuffle_seed_start: 0
  n_shuffle_seeds: 30
  comparison_lambdas: [0.1, 0.25, 0.5, 0.75]
  evaluation_seed_start: 81000
  n_evaluation_samples: 20
  evaluation_routes: 250
  scalability_sizes: [500, 1000, 2000]
  scalability_seed: 24242
  lsh_num_perm: 32
  lsh_bands: 16
  lsh_rows: 2
  jaccard_threshold: 0.5

integrated:
  jaccard_threshold: 0.5
  louvain_seed: 42
  signature_seed: 42
  budgets: [10, 20]
  lambdas: [0.25, 0.5]
  # Primary bandings are the M3 calibration operating points. The other three
  # are existing bandings chosen from calibration retrieval recall, not from
  # held-out placement coverage.
  primary_bandings:
    uniform: {role: primary, num_perm: 32, bands: 16, rows: 2}
    commuter_proxy: {role: primary, num_perm: 128, bands: 32, rows: 4}
  comparison_bandings:
    - {role: high_recall, num_perm: 64, bands: 32, rows: 2}
    - {role: moderate_recall, num_perm: 64, bands: 16, rows: 4}
    - {role: aggressive_reduction, num_perm: 32, bands: 4, rows: 8}
  scalability_sizes: [500, 1000, 2000]
  scalability_seed: 24242
  scalability_scenario: uniform
  scalability_banding: {num_perm: 32, bands: 16, rows: 2}
  timing_repeats: 5
  memory_repeats: 3

# M5.6 sensitivity. Sigma and the seed block were fixed before scoring
# coverage. The same edge-cost draw is accepted at both detour caps.
route_choice:
  sigma: 0.35
  detour_limits: [0.15, 0.30]
  seed_start: 91000
  n_seeds: 20
  budgets: [10, 20]
  balanced_lambda: 0.25
  placement_threshold: 0.5

# M5.7 scalability. Seeds and bandings were fixed before this run.
# The primary banding is the earlier uniform calibration choice, 32×16×2.
# It is remeasured here; its recall is not assumed to carry over.
scalability_study:
  scenario: uniform
  seed: 73000
  evaluation_seed: 73001
  evaluation_routes: 250
  sizes: [500, 1000, 2000, 5000, 10000]
  jaccard_threshold: 0.5
  louvain_seed: 42
  signature_seed: 42
  budget_k: 10
  lambda: 0.25
  primary_banding: {method: verified_lsh, num_perm: 32, bands: 16, rows: 2}
  comparison_bandings:
    - {method: lsh_64_32x2, num_perm: 64, bands: 32, rows: 2}
    - {method: lsh_64_16x4, num_perm: 64, bands: 16, rows: 4}
    - {method: lsh_128_32x4, num_perm: 128, bands: 32, rows: 4}
  timing_repeats: {500: 5, 1000: 5, 2000: 5, 5000: 3, 10000: 3}
  memory_repeats: {500: 3, 1000: 3, 2000: 3, 5000: 2, 10000: 1}
  streaming_exact_through: 2000
  streaming_probe_sizes: [5000]
  streaming_probe_budget_seconds: 120
  streaming_extend_if_median_seconds_below: 60
  streaming_extend_if_edges_below: 250000
  streaming_extended_timing_repeats: 1
  streaming_extended_memory_repeats: 1
  repeat_budget_seconds: 180
  max_candidate_pairs: 8000000
  max_bucket_size: 12000
  subset_recall_routes: 400
  subset_recall_seed: 73007

# M5.9 route-choice-aware placement. These seeds and weights were fixed
# before any held-out score from this study was computed. Training uses
# calibration OD pairs only. 82000–82009 do not overlap 91000–91019 or
# 92000–92019.
robust_placement:
  sigma: 0.35
  training_detour_limit: 0.15
  training_seed_start: 82000
  training_n_seeds: 10
  evaluation_seed_start: 92000
  evaluation_n_seeds: 20
  reference_seed_start: 91000
  reference_n_seeds: 20
  evaluation_detour_limits: [0.15, 0.30]
  budgets: [10, 20]
  municipal_additions: 5
  balanced_lambda: 0.25
  placement_threshold: 0.5
  scenarios: [uniform, commuter_proxy]

# M5.10 exact maximum coverage. The time limit and gap were fixed before
# looking at held-out scores. A run is optimal only when HiGHS certifies it.
exact_optimization:
  time_limit_seconds: 120
  mip_rel_gap: 1.0e-6
  budgets: [5, 10, 20, 30]
  community_lambda: 0.25
  community_threshold: 0.5
  weighted_budgets: [10, 20]
  pooled_k: 10
  robust_k: 10
  scale_route_counts: [100, 250, 500, 1000]
  scale_k: 10
  municipal_additions: 5
  scenarios: [uniform, commuter_proxy]

# M5.11 independent calibration draws. Seeds stay disjoint from M1 and M5.9.
# The unused evaluation offset satisfies the generator without creating held-out routes.
placement_stability:
  replicate_seed_start: 103000
  n_replicates: 30
  calibration_routes: 500
  budgets: [10, 20]
  pooled_k: 10
  scenarios: [uniform, commuter_proxy]
  unused_evaluation_offset: 1000003
  include_route_choice: true
  route_choice_seed_start: 113000

# M5.13 mapped-infrastructure policies. Classes were fixed from the saved tags
# before held-out scores. Unknown segments stay out of the restricted policies.
infrastructure:
  time_limit_seconds: 120
  mip_rel_gap: 1.0e-6
  budgets: [5, 10, 20]
  municipal_additions: 5
  scenarios: [uniform, commuter_proxy]
  policies: [unrestricted, explicit_facility, dedicated]

notes: >
  M1 pilot parameters. The rectangle above is the exact study boundary.
  Uniform and commuter-proxy draws are simulated routes, not bicycle counts.
  scripts/run_m1.py does not place counters. scripts/run_m2.py reads the
  placement budgets and seeds above and does not change route generation.
  scripts/run_m3.py reads the similarity settings and does not place counters.
  scripts/run_m4.py reads the optimization settings. map_lambda is fixed at
  0.25 before any held-out comparison. scripts/run_m5.py reads the validation
  settings and does not refit placements. scripts/run_integrated_study.py
  reads the integrated settings. It does not replace the M3 exact graph.
  alternative_route stays deferred for route generation in M1.
  scripts/run_route_choice_study.py reads route_choice and does not refit
  placements or redraw the saved OD pairs.
  scripts/run_scalability_study.py reads scalability_study. It does not
  overwrite the M1 routes or the integrated-study benchmarks.
  scripts/run_robust_placement.py reads robust_placement. It does not
  refit M2 or M4, and it does not read held-out routes while selecting.
  scripts/run_exact_optimization.py reads exact_optimization. It does not
  refit greedy placements or use held-out routes inside the MILP.
  scripts/run_placement_stability.py reads placement_stability. It does not
  overwrite the canonical routes or select counters from held-out routes.
