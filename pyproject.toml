[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclesense-cph"
version = "0.1.0"
description = "Route-similarity and graph-aware bicycle counter placement in Copenhagen"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - academic team project; no public license selected" }
dependencies = []

[project.optional-dependencies]
analysis = [
  "osmnx>=2.0",
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "datasketch>=1.6",
  "matplotlib>=3.8",
  "geopandas>=0.14",
  "jupyterlab>=4.0",
  "pyyaml>=6",
  "osmium>=4",
  "folium>=0.16",
  "certifi>=2024.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "networkx>=3.2",
  "folium>=0.16",
  "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
